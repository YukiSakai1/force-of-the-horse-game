<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Radial Menu Test</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    background: #0a0d20;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .test-container {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  #command-bar {
    display: flex !important;
  }
</style>
</head>
<body>
<div class="test-container">
  <div id="command-bar">
    <span class="drag-handle">⠿</span>
    <div class="cmd-menu" id="cmd-menu">
      <button class="cmd-menu-btn circular primary" data-cmd="run">
        <span class="btn-icon">🏇</span>
        <span class="btn-label">走破</span>
      </button>
      <button class="cmd-menu-btn circular" data-cmd="item">
        <span class="btn-icon">🃏</span>
        <span class="btn-label">アイテム</span>
      </button>
      <button class="cmd-menu-btn circular" data-cmd="end">
        <span class="btn-icon">🚩</span>
        <span class="btn-label">ターン終了</span>
      </button>
    </div>
    <button class="cmd-fab" id="cmd-fab" type="button" aria-label="コマンドメニュー">⟳</button>
  </div>
</div>
<script>
document.getElementById('cmd-fab').addEventListener('click', function() {
  this.classList.toggle('open');
  document.getElementById('cmd-menu').classList.toggle('open');
});
</script>
</body>
</html>
